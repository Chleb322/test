<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mObywatel - Własny Dowód Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    header {
      width: 100%;
      background-color: #1f2937;
      color: white;
      padding: 1rem;
      font-size: 1.5rem;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-top: 2rem;
    }
    .field { margin-bottom: 1rem; }
    .label { font-size: 0.85rem; color: #555; }
    .value { font-size: 1.1rem; font-weight: bold; color: #111; }
    .photo {
      width: 100px;
      height: 120px;
      background-color: #ccc;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    .button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .button:hover { background-color: #1e40af; }
    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 0.25rem;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>

<header>mObywatel - Własny Dowód Demo</header>

<div class="card">
  <div class="field">
    <div class="label">Zdjęcie (URL)</div>
    <input type="text" id="photoUrl" placeholder="Wklej link do zdjęcia">
  </div>
  <img id="photo" class="photo" src="" alt="Twoje zdjęcie">

  <div class="field">
    <div class="label">Imię i nazwisko</div>
    <input type="text" id="nameInput" placeholder="np. Jan Kowalski">
  </div>
  <div class="field">
    <div class="label">PESEL</div>
    <input type="text" id="peselInput" placeholder="np. 90010112345">
  </div>
  <div class="field">
    <div class="label">Data urodzenia</div>
    <input type="date" id="dobInput">
  </div>
  <div class="field">
    <div class="label">Seria i numer dowodu</div>
    <input type="text" id="seriesInput" placeholder="np. ABC123456">
  </div>

  <button class="button" onclick="updateCard()">Zaktualizuj dowód</button>
</div>

<div class="card" style="margin-top: 1.5rem;">
  <div class="section-title" style="margin-bottom: 1rem; font-weight: bold;">Twój Dowód Demo</div>
  <img id="cardPhoto" class="photo" src="" alt="Zdjęcie">
  <div class="field">
    <div class="label">Imię i nazwisko</div>
    <div class="value" id="cardName">---</div>
  </div>
  <div class="field">
    <div class="label">PESEL</div>
    <div class="value" id="cardPESEL">---</div>
  </div>
  <div class="field">
    <div class="label">Data urodzenia</div>
    <div class="value" id="cardDOB">---</div>
  </div>
  <div class="field">
    <div class="label">Seria i numer</div>
    <div class="value" id="cardSeries">---</div>
  </div>
</div>

<footer>To tylko wersja demonstracyjna. Nie jest dokumentem tożsamości.</footer>

<script>
  function updateCard() {
    const name = document.getElementById("nameInput").value;
    const pesel = document.getElementById("peselInput").value;
    const dob = document.getElementById("dobInput").value;
    const series = document.getElementById("seriesInput").value;
    const photoUrl = document.getElementById("photoUrl").value;

    document.getElementById("cardName").innerText = name || '---';
    document.getElementById("cardPESEL").innerText = pesel || '---';
    document.getElementById("cardDOB").innerText = dob || '---';
    document.getElementById("cardSeries").innerText = series || '---';
    document.getElementById("cardPhoto").src = photoUrl || "";
    document.getElementById("photo").src = photoUrl || "";
  }
</script>

</body>
</html>
